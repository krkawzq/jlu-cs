[project]
name = "prim-presentation"
version = "0.1.0"
description = "Interactive Prim course presentation with a local runtime and screenshot-based PPTX export"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "PyYAML>=6,<7",
]

[dependency-groups]
export = ["playwright>=1.50,<2", "python-pptx>=1.0.2,<2", "Pillow>=11,<13"]
